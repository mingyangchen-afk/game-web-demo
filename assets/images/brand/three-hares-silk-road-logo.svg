<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Mingsha Gate Three Hares Silk Road Logo</title>
  <desc id="desc">A circular three hares emblem combining Dunhuang caisson colors, European black silhouette geometry, and a game portal sound-ring motif.</desc>
  <defs>
    <radialGradient id="jade" cx="48%" cy="43%" r="60%">
      <stop offset="0" stop-color="#9adfc8"/>
      <stop offset=".58" stop-color="#49ad91"/>
      <stop offset="1" stop-color="#17594f"/>
    </radialGradient>
    <linearGradient id="gold" x1="34" x2="206" y1="28" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0a6"/>
      <stop offset=".42" stop-color="#e4b856"/>
      <stop offset="1" stop-color="#9f6429"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="petal" d="M120 14 L131 44 Q120 54 109 44 Z"/>
    <g id="hare">
