      <path d="M76 101 C67 104 58 103 51 98" fill="none" stroke="#100c09" stroke-linecap="round" stroke-width="6"/>
    </g>
  </defs>

  <circle cx="120" cy="120" r="112" fill="#7d211d"/>
  <g opacity=".92">
