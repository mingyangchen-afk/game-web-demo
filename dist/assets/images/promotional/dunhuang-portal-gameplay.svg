    <text x="118" y="55" class="label">电神之光</text>
    <text x="118" y="88" class="small">玩法动词：见 / 照明 / 辨伪</text>
    <text x="32" y="132" class="tiny">照出真假路径和伪造壁画；</text>
    <text x="32" y="156" class="tiny">稳定传送终点，避免坠入错乱时空。</text>
  </g>

