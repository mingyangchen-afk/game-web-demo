<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">敦煌风雨雷电四神与三兔共耳传送门玩法剧情概念图</title>
  <desc id="desc">中心为三兔共耳传送门，四周为风雨雷电四神玩法，右侧为剧情推进，底部为玩家能力循环。</desc>
  <defs>
    <radialGradient id="bgGlow" cx="48%" cy="44%" r="70%">
      <stop offset="0%" stop-color="#4f6f6a"/>
      <stop offset="34%" stop-color="#283d43"/>
      <stop offset="72%" stop-color="#422d28"/>
      <stop offset="100%" stop-color="#1f1c20"/>
    </radialGradient>
    <radialGradient id="portalCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff2b7"/>
      <stop offset="32%" stop-color="#65d1c2"/>
      <stop offset="62%" stop-color="#24727d"/>
      <stop offset="100%" stop-color="#142a35"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe6a2"/>
      <stop offset="43%" stop-color="#c9933a"/>
      <stop offset="100%" stop-color="#7a4b1d"/>
    </linearGradient>
    <linearGradient id="ribbonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d85837"/>
      <stop offset="100%" stop-color="#7f2e24"/>
    </linearGradient>
    <linearGradient id="ribbonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dbb89"/>
      <stop offset="100%" stop-color="#1f6a57"/>
    </linearGradient>
    <linearGradient id="ribbonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ca7c7"/>
      <stop offset="100%" stop-color="#1c5574"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0b0807" flood-opacity="0.55"/>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d8a448"/>
    </marker>
    <style>
      .bg { fill: url(#bgGlow); }
      .dust { fill: #f4c76f; opacity: .22; }
      .panel { fill: rgba(39, 32, 31, .82); stroke: #b9853b; stroke-width: 2; }
      .panel-soft { fill: rgba(22, 33, 37, .78); stroke: #8db7aa; stroke-width: 1.5; }
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 46px; font-weight: 700; fill: #fff1c1; letter-spacing: 0; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 22px; fill: #d8c5a1; letter-spacing: 0; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 25px; font-weight: 700; fill: #ffe7aa; letter-spacing: 0; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 19px; fill: #ead9bd; letter-spacing: 0; }
      .tiny { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 16px; fill: #d8cbb8; letter-spacing: 0; }
      .chip { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #1c2021; letter-spacing: 0; }
      .line { fill: none; stroke: #d8a448; stroke-width: 3; marker-end: url(#arrowGold); opacity: .88; }
      .thin-line { fill: none; stroke: #8fc7bd; stroke-width: 2; opacity: .5; }
      .gold { stroke: url(#goldStroke); }
      .no-fill { fill: none; }
    </style>
  </defs>

