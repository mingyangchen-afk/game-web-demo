    <text x="118" y="55" class="label">雷神之鼓</text>
    <text x="118" y="88" class="small">玩法动词：醒 / 节拍 / 破障</text>
    <text x="32" y="132" class="tiny">按鼓点启动门芯，震醒沉睡壁画；</text>
    <text x="32" y="156" class="tiny">雷链位移，击碎沙化护甲和封印。</text>
  </g>

