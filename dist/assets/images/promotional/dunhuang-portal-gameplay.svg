    <text x="118" y="55" class="label">雨师之露</text>
    <text x="118" y="88" class="small">玩法动词：生 / 修复 / 净化</text>
    <text x="32" y="132" class="tiny">补全褪色纹样，让隐藏目的地显现；</text>
    <text x="32" y="156" class="tiny">净化寂沙，恢复壁画与机关色彩。</text>
  </g>

