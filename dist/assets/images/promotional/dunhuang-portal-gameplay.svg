    <text x="118" y="55" class="label">风神之息</text>
    <text x="118" y="88" class="small">玩法动词：行 / 转向 / 滑翔</text>
    <text x="32" y="132" class="tiny">旋转三兔门环，改变传送方向；</text>
    <text x="32" y="156" class="tiny">开启风道、沙幕缝隙与空中路线。</text>
  </g>

